services:
  bot:
    image: ${GHCR_IMAGE:-ghcr.io/example/sushkabot}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - ${ENV_FILE}
    volumes:
      - ${DATA_DIR}:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
